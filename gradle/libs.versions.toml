[versions]
minSdk = "23"
compileSdk = "35"
kotlin = "2.3.21" # https://kotlinlang.org/docs/releases.html#release-details
agp = "9.2.1"  # https://maven.google.com/web/index.html?q=gradle.plugin#com.android.library:com.android.library.gradle.plugin
androidx-compose-ui = "1.10.4"   # https://developer.android.com/jetpack/androidx/releases/compose-ui
androidx-lifecycle = "2.9.1" # https://developer.android.com/jetpack/androidx/releases/lifecycle
androidx-savedstate = "1.3.0" # https://developer.android.com/jetpack/androidx/releases/savedstate
androidx-ktx = "1.16.0" # https://developer.android.com/kotlin/ktx#core
androidx-shapes = "1.1.0"  # https://developer.android.com/jetpack/androidx/releases/graphics
paparazzi = "2.0.0-alpha05.1" # https://github.com/cashapp/paparazzi/releases
dokka = "2.0.0" # https://github.com/kotlin/dokka/releases
assertk = "0.28.1" # https://github.com/assertk-org/assertk/releases
junit = "4.13.2"
testParameterInjector = "1.21" # https://github.com/google/TestParameterInjector/releases
composeLintChecks = "1.4.2" # https://github.com/slackhq/compose-lints/releases
mavenPublish = "0.37.0" # https://vanniktech.github.io/gradle-maven-publish-plugin/changelog/

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[libraries]
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose-ui" }
androidx-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-ktx" }
androidx-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "androidx-shapes" }

androidx-lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-savedstate = { module = "androidx.savedstate:savedstate-ktx", version.ref = "androidx-savedstate" }
composeLintChecks = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "composeLintChecks" }
paparazzi = { module = "app.cash.paparazzi:paparazzi", version.ref = "paparazzi" }

assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
junit = { module = "junit:junit", version.ref = "junit" }
testParameterInjector = { module = "com.google.testparameterinjector:test-parameter-injector", version.ref = "testParameterInjector" }
androidx-compose-ui-test-junit = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui" }
